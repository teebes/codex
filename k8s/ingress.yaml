apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codex-blog-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - blog.writtenrealms.com
    secretName: writtenrealms.com
  rules:
  - host: blog.writtenrealms.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: codex-blog-service
            port:
              number: 80