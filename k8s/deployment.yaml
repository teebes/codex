apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-blog
  labels:
    app: codex-blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codex-blog
  template:
    metadata:
      labels:
        app: codex-blog
    spec:
      serviceAccountName: forge-prod-service-account
      imagePullSecrets:
      - name: dockerhub
      containers:
      - name: codex-blog
        image: teebes/codex:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: WR_BLOG_GA
          value: "UA-129130800-2"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5